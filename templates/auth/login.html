{% extends "layout.html" %}
{% block content %}<div class="row justify-content-center mt-5"><div class="col-md-6 col-lg-4"><div class="card shadow-sm border-0"><div class="card-body p-4"><h3 class="text-center mb-4 fw-bold">{{ _('Login') }}</h3>{% with m=get_flashed_messages() %}{% if m %}<div class="alert alert-danger">{{ m[0] }}</div>{% endif %}{% endwith %}<form method="POST"><div class="mb-3"><label class="form-label">{{ _('Username') }}</label><input type="text" name="username" class="form-control" required></div><div class="mb-4"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div><button type="submit" class="btn btn-primary w-100">{{ _('Login') }}</button></form><div class="mt-3 text-center text-muted small">Don't have account? <a href="/register">{{ _('Register') }}</a></div></div></div></div></div>{% endblock %}
