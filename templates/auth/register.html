{% extends "layout.html" %}
{% block content %}<div class="row justify-content-center mt-5"><div class="col-md-6 col-lg-4"><div class="card shadow-sm border-0"><div class="card-body p-4"><h3 class="text-center mb-4 fw-bold">{{ _('Register') }}</h3>{% with m=get_flashed_messages() %}{% if m %}<div class="alert alert-danger">{{ m[0] }}</div>{% endif %}{% endwith %}<form method="POST"><div class="mb-3"><label class="form-label" for="username">{{ _('Username') }}</label><input type="text" id="username" name="username" class="form-control" required autocomplete="username"></div><div class="mb-4"><label class="form-label" for="password">{{ _('Password') }}</label><input type="password" id="password" name="password" class="form-control" required autocomplete="new-password"></div><button type="submit" class="btn btn-primary w-100">{{ _('Register') }}</button></form><div class="mt-3 text-center text-muted small">Has account? <a href="/login">{{ _('Login') }}</a></div></div></div></div></div>{% endblock %}
