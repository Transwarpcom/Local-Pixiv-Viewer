{% extends "layout.html" %}
{% block content %}
<div class="mb-4"><h3 class="fw-bold">{{ _('Series') }}: {{ series_title }}</h3><p class="text-muted">{{ works|length }} works</p></div>
<div class="list-group shadow-sm">{% for w in works %}<a href="/view/{{ w.id }}" class="list-group-item list-group-item-action p-3 d-flex align-items-start"><div class="me-3" style="width:80px;height:80px;flex-shrink:0">{% if w.cover_path %}<img src="/files/{{ w.cover_path|url_quote }}" class="w-100 h-100 rounded object-fit-cover">{% else %}<div class="w-100 h-100 bg-secondary text-white d-flex align-items-center justify-content-center rounded small">NO IMG</div>{% endif %}</div><div class="flex-grow-1"><div class="d-flex justify-content-between align-items-center mb-1"><h5 class="mb-0 fw-bold text-primary">{{ w.title }}</h5><span class="badge bg-dark">{{ w.series_order }}</span></div><p class="mb-1 text-muted small">{{ w.tags }}</p><small class="text-muted">{{ w.created_at[:10] }}</small></div></a>{% endfor %}</div>
{% endblock %}
