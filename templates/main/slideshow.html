<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zen Mode - Slideshow</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #slide-img { max-height: 100vh; max-width: 100vw; object-fit: contain; transition: opacity 1s ease-in-out; opacity: 0; }
        #controls { position: absolute; bottom: 20px; right: 20px; color: rgba(255,255,255,0.5); font-family: sans-serif; cursor: pointer; z-index: 10; opacity: 0; transition: opacity 0.3s; }
        body:hover #controls { opacity: 1; }
        #meta { position: absolute; bottom: 20px; left: 20px; color: white; font-family: sans-serif; text-shadow: 1px 1px 2px black; opacity: 0; transition: opacity 0.3s; }
        body:hover #meta { opacity: 1; }
        .visible { opacity: 1 !important; }
    </style>
</head>
<body>
    <img id="slide-img" src="">

    <div id="meta">
        <h2 id="title">Loading...</h2>
        <p id="artist">Artist</p>
    </div>

    <div id="controls" onclick="exit()">
        [Exit Zen Mode]
    </div>

<script>
    let works = [];
    let currentIndex = 0;
    const imgElement = document.getElementById('slide-img');
    const titleElement = document.getElementById('title');
    const artistElement = document.getElementById('artist');

    // Fetch top 100 high scoring images for slideshow
    fetch('{{ url_for("main.slideshow_data") }}')
        .then(r => r.json())
        .then(data => {
            works = data;
            if(works.length > 0) {
                showNext();
                setInterval(showNext, 5000); // 5 seconds per slide
            } else {
                titleElement.textContent = "No works found.";
            }
        });

    function showNext() {
        if (works.length === 0) return;

        // Fade out
        imgElement.classList.remove('visible');

        setTimeout(() => {
            const work = works[currentIndex];
            imgElement.src = work.url;
            titleElement.textContent = work.title;
            artistElement.textContent = work.artist;

            // Image load -> Fade in
            imgElement.onload = () => {
                imgElement.classList.add('visible');
            };

            currentIndex = (currentIndex + 1) % works.length;
        }, 1000); // Wait for fade out
    }

    function exit() {
        window.history.back();
    }
</script>
</body>
</html>
