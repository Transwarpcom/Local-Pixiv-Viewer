{% extends 'base.html' %}
{% block title %}{{ _('Gacha') }} - Pixiv Local{% endblock %}

{% block content %}
<div class="container text-center mt-5">
    <h1 class="mb-4 display-4">{{ _('Gacha Time!') }}</h1>
    <p class="lead mb-5">{{ _('Discover hidden gems or revisit old favorites.') }}</p>

    <div id="gacha-machine" class="mb-5">
        <div id="gacha-animation" style="display: none; height: 300px; align-items: center; justify-content: center;">
            <div class="spinner-border text-primary" style="width: 5rem; height: 5rem;" role="status">
                <span class="visually-hidden">{{ _('Loading...') }}</span>
            </div>
            <p class="mt-3 w-100">{{ _('Summoning...') }}</p>
        </div>

        <div id="results-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-5 g-4 justify-content-center" style="display: none;">
            <!-- Cards injected here -->
        </div>

        <div class="mt-5 btn-group">
            <button id="pull-btn-1" class="btn btn-lg btn-primary rounded-pill px-4 py-3 shadow mx-2" onclick="pullGacha(1)">
                <i class="bi bi-star"></i> {{ _('1x Pull') }}
            </button>
            <button id="pull-btn-10" class="btn btn-lg btn-warning rounded-pill px-4 py-3 shadow mx-2 text-dark fw-bold" onclick="pullGacha(10)">
                <i class="bi bi-stars"></i> {{ _('10x Pull') }}
            </button>
        </div>
    </div>
</div>

<template id="card-template">
    <div class="col result-card" style="transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
        <div class="card h-100 shadow-sm">
            <div class="card-header fw-bold small text-truncate">SSR</div>
            <a href="#" class="card-link">
                <img src="" class="card-img-top" style="height: 200px; object-fit: cover;">
            </a>
            <div class="card-body p-2">
                <h6 class="card-title text-truncate small mb-0">Title</h6>
            </div>
        </div>
    </div>
</template>

<script>
function pullGacha(count) {
    const container = document.getElementById('results-container');
    const anim = document.getElementById('gacha-animation');
    const btns = document.querySelectorAll('.btn-lg');
    const tmpl = document.getElementById('card-template');

    // UI Reset
    btns.forEach(b => b.disabled = true);
    container.style.display = 'none';
    container.innerHTML = '';
    anim.style.display = 'flex';

    fetch('{{ url_for("main.gacha_pull") }}?count=' + count)
        .then(r => r.json())
        .then(data => {
            if(data.error) { alert(data.error); location.reload(); return; }

            setTimeout(() => {
                anim.style.display = 'none';
                container.style.display = 'flex';

                data.results.forEach((item, index) => {
                    const clone = tmpl.content.cloneNode(true);
                    const card = clone.querySelector('.result-card');
                    const img = clone.querySelector('img');
                    const title = clone.querySelector('.card-title');
                    const link = clone.querySelector('.card-link');
                    const header = clone.querySelector('.card-header');

                    img.src = item.thumb_url;
                    title.textContent = item.title;
                    link.href = item.url;

                    // Rarity
                    if (item.view_count > 100) {
                        header.textContent = "{{ _('UR') }}";
                        header.className = "card-header bg-danger text-white fw-bold small";
                    } else if (item.view_count > 20) {
                        header.textContent = "{{ _('SSR') }}";
                        header.className = "card-header bg-warning text-dark fw-bold small";
                    } else {
                        header.textContent = "{{ _('R') }}";
                        header.className = "card-header bg-info text-white fw-bold small";
                    }

                    container.appendChild(clone);

                    // Staggered animation
                    setTimeout(() => {
                        // We need to re-select because clone is doc frag
                        container.children[index].style.transform = 'scale(1)';
                    }, index * 100);
                });

                btns.forEach(b => b.disabled = false);
            }, 1000);
        });
}
</script>
{% endblock %}
